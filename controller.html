<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>擁擠森林 · 手機控制器</title>
    <script type="module" crossorigin src="./assets/controller-BJ6dc4Lf.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/send-DALaW9oG.js">
    <link rel="stylesheet" crossorigin href="./assets/controller-Bfq-DQbk.css">
  </head>
  <body>
    <div id="rotate-hint">請把手機橫過來</div>
    <div id="pad" hidden>
      <div id="stick-zone"></div>
      <div id="right">
        <div id="status"></div>
        <button id="dash" type="button">衝刺</button>
      </div>
    </div>
    <div id="choices" hidden>
      <div id="choices-title">升級！選一個</div>
      <div id="choices-list"></div>
      <button id="reroll" type="button">重抽</button>
    </div>
    <div id="dead" hidden>你倒下了<small>請看電腦畫面</small></div>
    <form id="join" hidden>
      <div>輸入電腦畫面上的房號</div>
      <input id="join-input" maxlength="6" autocomplete="off" autocapitalize="characters" />
      <button type="submit">連線</button>
    </form>
  </body>
</html>
